[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenbench"
version = "0.7.0"
description = "Energy benchmarking & optimization of large-scale data-processing algorithms. Same result, not the same energy."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bajar Omar" }, { name = "Khlif Bilel" }]
keywords = ["energy", "benchmark", "green-it", "rapl", "data-processing"]
dependencies = [
  "numpy>=1.26",
  "pyarrow>=15",
  "scipy>=1.11",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
greenbench = "greenbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greenbench = ["server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
